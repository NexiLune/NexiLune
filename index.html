<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexiLune</title>

    <!-- Preload Resources -->
    <link rel="preload" href="css/styles.css" as="style" />
    <link rel="preload" href="js/scripts.js" as="script" />
    <link
      rel="preload"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      as="style"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <!-- Loading Screen -->
    <div class="loading" aria-hidden="true">
      <canvas id="loading-particles" class="loading-particles"></canvas>

      <div class="binary-loading-container">
        <!-- Letter grid containers -->
        <div class="binary-letter" id="letter-n">
          <!-- Generated by JS -->
        </div>
        <div class="binary-letter" id="letter-i">
          <!-- Generated by JS -->
        </div>
        <div class="binary-letter" id="letter-m">
          <!-- Generated by JS -->
        </div>
        <div class="binary-letter" id="letter-a">
          <!-- Generated by JS -->
        </div>
      </div>

      <div class="terminal-container">
        <div class="binary-code-line">
          <span class="terminal-prompt">></span> initializing README.exe
        </div>
      </div>
    </div>

    <!-- UI Elements -->
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>
    <div class="cursor-coordinates" aria-hidden="true">X: 0 | Y: 0</div>

    <!-- Copy notification element -->
    <div class="copy-notification" id="copyNotification">
      Ethereum address copied to clipboard!
    </div>

    <!-- Background Canvas -->
    <div
      class="minimalist-background"
      id="minimalist-background"
      aria-hidden="true"
    >
      <canvas id="particle-background"></canvas>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="container">
      <div class="content-wrapper">
        <div class="hero-container">
          <header class="hero">
            <div class="text-container">
              <h1 class="distort-text">
                <span class="name-text">NexiLune</span>
              </h1>
            </div>

            <div class="typing-container" aria-live="polite">
              <div class="typing-text"></div>
              <div class="typing-cursor"></div>
            </div>

            <p class="hero-subtitle" id="subtitle">
              Elevating digital presence through refined design and immaculate
              code execution.
            </p>

            <div class="btn-wrapper">
              <a
                href="https://github.com/NexiLune"
                class="magnetic-btn"
                aria-label="Visit my GitHub profile"
              >
                <i class="fab fa-github" aria-hidden="true"></i>
                <span>GitHub</span>
              </a>

              <a
                href="https://t.me/nexilune"
                class="magnetic-btn telegram-btn"
                aria-label="Contact me on Telegram"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fab fa-telegram-plane" aria-hidden="true"></i>
                <span>Telegram</span>
              </a>

              <a
                href="#"
                class="magnetic-btn eth-donate-btn"
                aria-label="Donate Ethereum"
                data-address="0xff00b110D666e0c025E4377BbF3239082B4a5db9"
                onclick="copyEthAddress(event)"
              >
                <i class="fab fa-ethereum" aria-hidden="true"></i>
                <span>Donate</span>
              </a>
            </div>
          </header>
        </div>
      </div>
    </main>
    <!-- JavaScript -->
    <script src="js/scripts.js" defer></script>
  </body>
</html>
